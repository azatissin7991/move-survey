  # ---- Frames ----
  - id: bed-frame-metal
    category: beds
    rooms: [bedroom, kids_room]
    name: { en: "Bed frame, metal", ru: "Металлический каркас кровати" }
    aliases: { en: [metal bed frame, hollywood frame], ru: [металлическая рама кровати] }
