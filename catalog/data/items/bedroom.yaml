# Beds and bedroom storage. All values are drafts (est-draft) until a reviewer
# adds a citation and sets review: signed_off.
defaultSources:
  - { field: all, ref: est-draft }

items:
  # ---- Mattresses (size by width) ----
  - id: mattress-king
    category: beds
    rooms: [bedroom]
    name: { en: "Mattress, King / Cal King", ru: "Матрас King / Cal King" }
    aliases: { en: [king mattress, california king mattress], ru: [матрас кинг] }
    cues: "Widest mattress, about 72–76 in wide; Cal King is narrower and longer."
    dims: { l: [79, 84], w: [72, 76], h: [10, 14] }
    shape: soft
    cuFt: 40
    weightLbs: 120
    weightNote: "Spring/foam mattresses are far lighter than 7 lb/cu ft."
    sizeGroup: mattress
    sizeRule: { dim: w, min: 68 }
  - id: mattress-queen
    category: beds
    rooms: [bedroom]
    name: { en: "Mattress, Queen", ru: "Матрас Queen" }
    aliases: { en: [queen mattress], ru: [матрас квин] }
    cues: "About 60 in wide, 80 in long."
    dims: { l: [79, 80], w: [59, 61], h: [10, 14] }
    shape: soft
    cuFt: 32
    weightLbs: 100
    weightNote: "Spring/foam mattresses are far lighter than 7 lb/cu ft."
    sizeGroup: mattress
    sizeRule: { dim: w, min: 58, max: 68 }
  - id: mattress-full
    category: beds
    rooms: [bedroom, kids_room]
    name: { en: "Mattress, Full", ru: "Матрас Full (полуторный)" }
    aliases: { en: [full mattress, double mattress], ru: [полуторный матрас] }
    cues: "About 54 in wide, 75 in long."
    dims: { l: [74, 76], w: [53, 55], h: [9, 13] }
    shape: soft
    cuFt: 25
    weightLbs: 80
    weightNote: "Spring/foam mattresses are far lighter than 7 lb/cu ft."
    sizeGroup: mattress
    sizeRule: { dim: w, min: 45, max: 58 }
  - id: mattress-twin
    category: beds
    rooms: [bedroom, kids_room]
    name: { en: "Mattress, Twin / Twin XL", ru: "Матрас Twin (односпальный)" }
    aliases: { en: [twin mattress, single mattress], ru: [односпальный матрас] }
    cues: "About 38–39 in wide."
    dims: { l: [74, 80], w: [38, 39], h: [8, 12] }
    shape: soft
    cuFt: 16
    weightLbs: 55
    weightNote: "Spring/foam mattresses are far lighter than 7 lb/cu ft."
    sizeGroup: mattress
    sizeRule: { dim: w, max: 45 }

  # ---- Box springs / foundations ----
  - id: box-spring-king
    category: beds
    rooms: [bedroom]
    name: { en: "Box spring, King (pair)", ru: "Пружинное основание King (2 части)" }
    aliases: { en: [king foundation, split king box spring], ru: [основание кинг] }
    cues: "Usually two twin-XL halves under a king mattress; count the pair once."
    dims: { l: [79, 80], w: [76, 76], h: [5, 9] }
    shape: boxy
    cuFt: 30
    weightLbs: 80
    weightNote: "Wood frame and fabric; light for its volume."
    sizeGroup: box_spring
    sizeRule: { dim: w, min: 68 }
  - id: box-spring-queen
