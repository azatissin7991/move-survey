# Expected packed boxes for a MEDIUM room of each type, by how full it looks.
# Stage E scales by room size and subtracts boxes already counted on camera.
# Draft values; the calibration loop replaces them with fitted numbers.
sources:
  - { field: all, ref: est-draft }

sizeMultiplier: { small: 0.7, medium: 1.0, large: 1.4 }

